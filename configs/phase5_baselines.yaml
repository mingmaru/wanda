# Phase 5 reference baselines for the Phase 3 main experiment.
#
# Magnitude is deterministic (no calibration data), so one run per
# sparsity. SparseGPT with C4 at 3 seeds for the headline sparsities
# 50% and 70%. These are the "literature anchors" that Phase 3 Wanda
# results are compared against.

name: phase5_baselines
defaults:
  model: meta-llama/Meta-Llama-3-8B
  sparsity_type: unstructured
  nsamples: 128
  eval_zero_shot: true
  eval_tasks: headline
  eval_korean_ppl: true
  env:
    CUDA_VISIBLE_DEVICES: "0"

runs:
  # Magnitude pruning -- calibration-free, deterministic.
  - prune_method: magnitude
    sparsity_ratio: 0.5
    seed: 0
    save_template: out/phase5/magnitude_50/
  - prune_method: magnitude
    sparsity_ratio: 0.6
    seed: 0
    save_template: out/phase5/magnitude_60/
  - prune_method: magnitude
    sparsity_ratio: 0.7
    seed: 0
    save_template: out/phase5/magnitude_70/

  # SparseGPT with C4 calibration, 3 seeds at 50% and 70%.
  - prune_method: sparsegpt
    calib_data: c4
    sparsity_ratio: 0.5
    seeds: [0, 1, 2]
    save_template: out/phase5/sparsegpt_c4_50_seed{seed}/
  - prune_method: sparsegpt
    calib_data: c4
    sparsity_ratio: 0.7
    seeds: [0, 1, 2]
    save_template: out/phase5/sparsegpt_c4_70_seed{seed}/
