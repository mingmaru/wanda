# Phase 3 main experiment: cross-calibration on LLaMA-3-8B.
#
# Seed counts follow predictions.md section 7:
#   - Headline cells (C4 / MC4-ko at 50% and 70%): 5 seeds each.
#   - Secondary cells (The Stack / random at 50% and 70%): 3 seeds each.
# Total: 4 * 5 + 4 * 3 = 32 cells.

name: phase3_main
defaults:
  model: meta-llama/Meta-Llama-3-8B
  prune_method: wanda
  sparsity_type: unstructured
  nsamples: 128
  eval_zero_shot: true
  eval_tasks: headline
  eval_korean_ppl: true

runs:
  # ---- Headline cells (5 seeds) ----
  - calib_data: c4
    sparsity_ratio: 0.5
    seeds: [0, 1, 2, 3, 4]
    save_template: out/phase3/wanda_c4_50_seed{seed}/
  - calib_data: mc4_ko
    sparsity_ratio: 0.5
    seeds: [0, 1, 2, 3, 4]
    save_template: out/phase3/wanda_mc4ko_50_seed{seed}/
  - calib_data: c4
    sparsity_ratio: 0.7
    seeds: [0, 1, 2, 3, 4]
    save_template: out/phase3/wanda_c4_70_seed{seed}/
  - calib_data: mc4_ko
    sparsity_ratio: 0.7
    seeds: [0, 1, 2, 3, 4]
    save_template: out/phase3/wanda_mc4ko_70_seed{seed}/

  # ---- Secondary cells (3 seeds) ----
  - calib_data: the_stack
    sparsity_ratio: 0.5
    seeds: [0, 1, 2]
    save_template: out/phase3/wanda_stack_50_seed{seed}/
  - calib_data: random
    sparsity_ratio: 0.5
    seeds: [0, 1, 2]
    save_template: out/phase3/wanda_random_50_seed{seed}/
  - calib_data: the_stack
    sparsity_ratio: 0.7
    seeds: [0, 1, 2]
    save_template: out/phase3/wanda_stack_70_seed{seed}/
  - calib_data: random
    sparsity_ratio: 0.7
    seeds: [0, 1, 2]
    save_template: out/phase3/wanda_random_70_seed{seed}/
