# Backwards-compat config matching Minguhn's original 14-run plan.
#
# Use this if you want to run his planned scope only (no seed expansion,
# no LLaMA-2-7B anchor, no within-source baselines). The redesigned plan
# is in phase1_anchor.yaml + phase3_main.yaml + phase5_baselines.yaml.
#
# Exp 1: Magnitude/SparseGPT/Wanda(*4 calibs) at 50% = 6 runs.
# Exp 2: Magnitude/SparseGPT/Wanda(C4) at 60%/70% = 6 new runs (50% reuses Exp 1).
# Exp 3: Wanda(MC4-ko) at 70% = 1 new run.
# Single-seed throughout, matching the original notes.

name: minguhn_14
defaults:
  model: meta-llama/Meta-Llama-3-8B
  sparsity_type: unstructured
  nsamples: 128
  seed: 0
  eval_zero_shot: true
  eval_tasks: headline
  eval_korean_ppl: true

runs:
  # ---- Exp 1: 50% sparsity, 4 calibrations + 2 reference baselines ----
  - prune_method: magnitude
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_magnitude/
  - prune_method: sparsegpt
    calib_data: c4
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_sparsegpt_c4/
  - prune_method: wanda
    calib_data: c4
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_wanda_c4/
  - prune_method: wanda
    calib_data: mc4_ko
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_wanda_mc4ko/
  - prune_method: wanda
    calib_data: the_stack
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_wanda_stack/
  - prune_method: wanda
    calib_data: random
    sparsity_ratio: 0.5
    save_template: out/minguhn14/exp1_wanda_random/

  # ---- Exp 2: C4 at 60% / 70% sparsity, 3 pruning methods ----
  - prune_method: magnitude
    sparsity_ratio: 0.6
    save_template: out/minguhn14/exp2_magnitude_60/
  - prune_method: magnitude
    sparsity_ratio: 0.7
    save_template: out/minguhn14/exp2_magnitude_70/
  - prune_method: sparsegpt
    calib_data: c4
    sparsity_ratio: 0.6
    save_template: out/minguhn14/exp2_sparsegpt_60/
  - prune_method: sparsegpt
    calib_data: c4
    sparsity_ratio: 0.7
    save_template: out/minguhn14/exp2_sparsegpt_70/
  - prune_method: wanda
    calib_data: c4
    sparsity_ratio: 0.6
    save_template: out/minguhn14/exp2_wanda_c4_60/
  - prune_method: wanda
    calib_data: c4
    sparsity_ratio: 0.7
    save_template: out/minguhn14/exp2_wanda_c4_70/

  # ---- Exp 3: Wanda MC4-ko at 70% (1 new) ----
  - prune_method: wanda
    calib_data: mc4_ko
    sparsity_ratio: 0.7
    save_template: out/minguhn14/exp3_wanda_mc4ko_70/
